<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
<rect width="600" height="440" fill="#fff9f6"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="40" y="60" font-size="13" letter-spacing="2" fill="#c13535" font-family="Menlo,Consolas,monospace">TWO SPORE-FORMING STRAINS</text>
<g transform="translate(180,210)"><ellipse cx="0" cy="0" rx="70" ry="34" fill="none" stroke="#f13b3b" stroke-width="4"/><ellipse cx="0" cy="0" rx="46" ry="18" fill="#f13b3b" opacity=".25"/><ellipse cx="0" cy="0" rx="20" ry="9" fill="#f13b3b"/>
<text x="0" y="78" font-size="16" font-style="italic" fill="#1a1113" text-anchor="middle" font-weight="bold">Bacillus subtilis</text></g>
<g transform="translate(420,210)"><ellipse cx="0" cy="0" rx="70" ry="34" fill="none" stroke="#c13535" stroke-width="4"/><ellipse cx="0" cy="0" rx="46" ry="18" fill="#c13535" opacity=".25"/><ellipse cx="0" cy="0" rx="20" ry="9" fill="#c13535"/>
<text x="0" y="78" font-size="16" font-style="italic" fill="#1a1113" text-anchor="middle" font-weight="bold">Bacillus coagulans</text></g>
<text x="300" y="340" font-size="13" fill="#6b5f62" text-anchor="middle">Dormant spore  →  survives stomach acid  →  activates in the gut</text>
<text x="300" y="400" font-size="10.5" fill="#948a8d" text-anchor="middle" font-family="Menlo,Consolas,monospace">Illustrative. Spore-survival claim needs a source. [S]</text>
</g></svg>