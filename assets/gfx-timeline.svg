<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
<rect width="600" height="440" fill="#fff9f6"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="40" y="60" font-size="13" letter-spacing="2" fill="#c13535" font-family="Menlo,Consolas,monospace">WHAT TO EXPECT</text>
<line x1="60" y1="200" x2="540" y2="200" stroke="#1a1113" stroke-width="2"/>
<g><circle cx="60" cy="200" r="14" fill="#f13b3b"/><text x="60" y="205" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="60" y="150" font-size="22" font-weight="bold" fill="#1a1113" text-anchor="middle">Day 1</text></g>
<g><circle cx="220" cy="200" r="14" fill="#f13b3b"/><text x="220" y="205" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">7</text>
<text x="220" y="150" font-size="22" font-weight="bold" fill="#1a1113" text-anchor="middle">Day 7</text></g>
<g><circle cx="540" cy="200" r="14" fill="#c13535"/><text x="540" y="205" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">30</text>
<text x="540" y="150" font-size="22" font-weight="bold" fill="#1a1113" text-anchor="middle">Day 30</text></g>
<rect x="60" y="196" width="160" height="8" fill="#f7d6d6"/><rect x="220" y="196" width="320" height="8" fill="#f13b3b" opacity=".35"/>
<text x="140" y="250" font-size="14" fill="#1a1113" text-anchor="middle" font-weight="bold">It's just a habit.</text>
<text x="140" y="270" font-size="12" fill="#6b5f62" text-anchor="middle">One capsule, with water,</text><text x="140" y="286" font-size="12" fill="#6b5f62" text-anchor="middle">any time of day.</text>
<text x="380" y="250" font-size="14" fill="#1a1113" text-anchor="middle" font-weight="bold">Consistency is the point.</text>
<text x="380" y="270" font-size="12" fill="#6b5f62" text-anchor="middle">The strains need daily intake</text><text x="380" y="286" font-size="12" fill="#6b5f62" text-anchor="middle">to keep working.</text>
<text x="300" y="400" font-size="10.5" fill="#948a8d" text-anchor="middle" font-family="Menlo,Consolas,monospace">No outcome claims. Ritual only. [S]</text>
</g></svg>